# サーバ一覧
# 増減は項目を追加・削除してください（ページ再読み込みで反映）。
#
# このツールは docker-compose.yml で network_mode: host を指定しているため、
# 管理ホスト自身を監視対象に含める場合は host: localhost を指定してください。

servers:
  # 管理ホスト自身（このツールが動いているサーバ）
  - id: server-a
    name: 開発サーバA (ホスト)
    host: localhost
    ssh_user: devuser
    ssh_port: 22

  - id: server-b
    name: 開発サーバB
    host: 192.168.1.11
    ssh_user: devuser
    ssh_port: 22

  - id: server-c
    name: 開発サーバC
    host: 192.168.1.12
    ssh_user: devuser
    ssh_port: 22

  - id: server-d
    name: 開発サーバD
    host: 192.168.1.13
    ssh_user: devuser
    ssh_port: 22
