# サーバ一覧
# 増減は項目を追加・削除してください（ページ再読み込みで反映）。
#
# フィールド:
#   id        : 内部識別子（DB保存に使用）
#   name      : 画面表示名
#   host      : 画面表示・SSH接続のIP（基本はこれだけ書けばよい）
#   ssh_host  : SSH接続だけを上書きしたい時に指定（任意）
#                 例: 管理ホスト自身を監視対象にする場合、host は実IP、
#                 ssh_host は localhost にする（network_mode: host 環境）
#   ssh_user  : SSH接続ユーザ
#   ssh_port  : SSHポート

servers:
  # 管理ホスト自身（このツールが動いているサーバ）
  - id: server-a
    name: 開発サーバA (ホスト)
    host: 192.168.1.10
    ssh_host: localhost
    ssh_user: devuser
    ssh_port: 22

  - id: server-b
    name: 開発サーバB
    host: 192.168.1.11
    ssh_user: devuser
    ssh_port: 22

  - id: server-c
    name: 開発サーバC
    host: 192.168.1.12
    ssh_user: devuser
    ssh_port: 22

  - id: server-d
    name: 開発サーバD
    host: 192.168.1.13
    ssh_user: devuser
    ssh_port: 22
