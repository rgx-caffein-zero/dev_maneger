services:
  app:
    build: .
    container_name: dev_maneger
    ports:
      - "8501:8501"
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./ssh:/root/.ssh:ro
    environment:
      - TZ=Asia/Tokyo
    extra_hosts:
      # コンテナからホスト機にアクセスするための名前解決
      # ホスト機(管理ホスト自身)を servers.yaml で host: host.docker.internal と指定するために必要
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
