services:
  app:
    build: .
    container_name: dev_maneger
    # ホストと同じネットワーク名前空間で動作させる。
    # - コンテナから localhost でホスト自身にSSH到達可能
    # - 他サーバへのSSHは実IPで到達
    # - Docker バージョン非依存（extra_hosts: host-gateway を使わない）
    # 副作用: ports: は無効になる（host の 8501 をそのまま使用）。
    network_mode: host
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./ssh:/root/.ssh:ro
    environment:
      - TZ=Asia/Tokyo
    restart: unless-stopped
